id: errata.structured-list-table.checkbox-names
component: structured-list-table
upstream:
  version: 1.1.0
  files:
    - upstream/krds-html/html/code/structured_list_table.html
defect:
  type: unnamed-row-selection-checkboxes
  literalSource:
    selectors:
      - ".krds-table-wrap tbody .krds-form-check input[type='checkbox']"
      - ".krds-table-wrap tbody .krds-form-check label:empty"
    behavior: >-
      Each body-row checkbox is associated with an empty label, so assistive technology cannot
      distinguish which table row the checkbox selects.
correction:
  behavior: >-
    Give each native row checkbox an aria-label composed from the table caption, one-based row
    position, and the selection action while preserving the native checkbox and table hierarchy.
  attributes:
    - selector: ".krds-table-wrap tbody > tr:nth-child(1) .krds-form-check input[type='checkbox']"
      attribute: aria-label
      rule: "exact-value:000에 대한 표로 유형 제목 내용 게시일로 구성되어있다. 1 선택"
    - selector: ".krds-table-wrap tbody > tr:nth-child(2) .krds-form-check input[type='checkbox']"
      attribute: aria-label
      rule: "exact-value:000에 대한 표로 유형 제목 내용 게시일로 구성되어있다. 2 선택"
    - selector: ".krds-table-wrap tbody > tr:nth-child(3) .krds-form-check input[type='checkbox']"
      attribute: aria-label
      rule: "exact-value:000에 대한 표로 유형 제목 내용 게시일로 구성되어있다. 3 선택"
    - selector: ".krds-table-wrap tbody > tr:nth-child(4) .krds-form-check input[type='checkbox']"
      attribute: aria-label
      rule: "exact-value:000에 대한 표로 유형 제목 내용 게시일로 구성되어있다. 4 선택"
    - selector: ".krds-table-wrap tbody > tr:nth-child(5) .krds-form-check input[type='checkbox']"
      attribute: aria-label
      rule: "exact-value:000에 대한 표로 유형 제목 내용 게시일로 구성되어있다. 5 선택"
    - selector: ".krds-table-wrap tbody > tr:nth-child(6) .krds-form-check input[type='checkbox']"
      attribute: aria-label
      rule: "exact-value:000에 대한 표로 유형 제목 내용 게시일로 구성되어있다. 6 선택"
    - selector: ".krds-table-wrap tbody > tr:nth-child(7) .krds-form-check input[type='checkbox']"
      attribute: aria-label
      rule: "exact-value:000에 대한 표로 유형 제목 내용 게시일로 구성되어있다. 7 선택"
