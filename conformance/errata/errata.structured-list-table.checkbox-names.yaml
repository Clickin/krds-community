evidence:
  sourceUrls:
    - https://www.w3.org/WAI/WCAG22/Techniques/html/H44.html
    - https://github.com/KRDS-uiux/krds-uiux/blob/d6bb184c823e4757f05807ea4646a23e3133b6e6/html/code/structured_list_table.html#L91-L94
  rationale: >-
    W3C technique H44 requires a label that identifies a form control's purpose. The pinned body
    rows pair each checkbox with an empty label, so a row-specific accessible name is required.
