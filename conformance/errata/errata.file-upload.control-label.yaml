id: errata.file-upload.control-label
component: file-upload
upstream:
  version: 1.1.0
  files:
    - upstream/krds-html/html/code/file_upload.html
defect:
  type: missing-control-relationship
  literalSource:
    selectors:
      - ".file-upload-btn-wrap > input[type=file]"
    behavior: >-
      The delegated file input has no accessible name of its own.
correction:
  behavior: >-
    Add an aria-label from the select label or title so the hidden control is nameable.
  attributes:
    - selector: ".file-upload-btn-wrap > input[type=file]"
      attribute: aria-label
      rule: "select label or title text"
fixtures:
  - file-upload.default
normalization:
  whitelist:
    - selector: ".file-upload-btn-wrap > input[type=file]"
      attribute: aria-label
      operation: omit
evidence:
  rationale: >-
    Framework adds the input's accessible name; attribute is a non-semantic addition vs upstream.
