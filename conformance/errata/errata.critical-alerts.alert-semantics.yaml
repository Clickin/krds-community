id: errata.critical-alerts.alert-semantics
component: critical-alerts
upstream:
  version: 1.1.0
  files:
    - upstream/krds-html/html/code/critical_alerts.html
defect:
  type: missing-alert-semantics
  literalSource:
    selectors:
      - ".krds-critical-alerts"
    behavior: >-
      The urgent-message list is visually presented as critical alerts but exposes only generic
      list semantics, so newly presented urgent content is not identified as an alert.
correction:
  behavior: >-
    Preserve the native list and its items while exposing the list container as an alert region.
    Do not remove the list descendants or their link semantics.
  attributes:
    - selector: ".krds-critical-alerts"
      attribute: role
      rule: "exact-value:alert"
fixtures:
  - critical-alerts.default
normalization:
  whitelist:
    - selector: ".krds-critical-alerts"
      attribute: role
      rule: "exact-value:alert"
evidence:
  sourceUrls:
    - https://www.w3.org/WAI/ARIA/apg/patterns/alert/
  rationale: >-
    Alert semantics allow assistive technology to identify urgent, time-sensitive messages while
    retaining the list's visible hierarchy and interactive links.
