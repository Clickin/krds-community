id: errata.help-panel.disclosure-relationships
component: help-panel
upstream:
  version: 1.1.0
  files:
    - upstream/krds-html/html/code/help_panel.html
    - upstream/krds-html/html/code/tutorial_panel.html
defect:
  type: disclosure-missing-control-relationship
  literalSource:
    selectors:
      - ".btn-conts-expand"
    behavior: The literal disclosure toggle lacks a stable controlled-panel reference.
correction:
  behavior: >-
    Give each expand-wrap a stable id and reference it from the disclosure toggle's
    aria-controls so the expanded state names its target.
  attributes:
    - selector: ".btn-conts-expand"
      attribute: aria-controls
      rule: "references: sibling .expand-wrap[id]"
    - selector: ".expand-wrap"
      attribute: id
      rule: "stable generated id for the disclosure target"
fixtures:
  - help-panel.default
  - tutorial-panel.default
normalization:
  whitelist:
    - selector: ".btn-conts-expand"
      attribute: aria-controls
      operation: omit
    - selector: ".expand-wrap"
      attribute: id
      operation: omit
    - selector: ".btn-conts-expand"
      attribute: aria-label
      operation: omit
    - selector: ".btn-conts-expand"
      attribute: aria-expanded
      operation: omit
    - selector: ".krds-help-panel"
      attribute: hidden
      operation: omit
      rule: "framework hides the closed panel with the hidden attribute the upstream literal lacks"
    - selector: ".expand-wrap"
      attribute: inert
      operation: omit
      rule: "framework disables the collapsed panel with inert; the upstream literal lacks it (same effect as its own hidden state)"
    - selector: ".krds-info-list"
      attribute: role
      operation: omit
      rule: "framework statically adds role=list, which upstream's own krds_infoList runtime adds on init; redundant with native ul semantics"
    - selector: ".krds-info-list li"
      attribute: role
      operation: omit
      rule: "framework statically adds role=listitem, which upstream's own krds_infoList runtime adds on init; redundant with native li semantics"

evidence:
  rationale: >-
    Framework adds the disclosure id/aria-controls pairing; the attributes are
    non-semantic additions compared against the literal upstream markup.
