id: errata.text-input.error-description
component: text-input
upstream:
  version: 1.1.0
  files:
    - upstream/krds-html/html/code/text_input_state.html
defect:
  type: missing-error-message-relationship
  literalSource:
    selectors:
      - ".form-conts.is-error .krds-input"
      - ".form-hint-invalid"
    behavior: >-
      The literal input has no aria-invalid state and the error message has no
      id referenced by the input, so the visible error text is not programmatically
      associated with the invalid field.
correction:
  behavior: >-
    Preserve the native label-for/id relationship, expose aria-invalid="true"
    for the error state, and associate the generated stable message id through
    aria-describedby.
  attributes:
    - selector: ".form-conts.is-error .krds-input"
      attribute: aria-invalid
      rule: "exact-value:true"
    - selector: ".form-conts.is-error .krds-input"
      attribute: aria-describedby
      rule: "references: .form-hint-invalid[id]"
    - selector: ".form-hint-invalid"
      attribute: id
      rule: "stable-generated-id; referenced-by: .form-conts.is-error .krds-input[aria-describedby]"
fixtures:
  - text-input.error.medium
normalization:
  whitelist:
    - selector: ".form-hint-invalid"
      attribute: id
      rule: stable-generated-id
    - selector: ".form-conts.is-error .krds-input"
      attribute: aria-describedby
      rule: "must-reference: .form-hint-invalid[id]"
    - selector: ".form-conts.is-error .krds-input"
      attribute: aria-invalid
      rule: "exact-value:true"
evidence:
  sourceUrls:
    - https://www.w3.org/WAI/WCAG21/Techniques/aria/ARIA9
  rationale: >-
    WCAG technique ARIA9 requires an input's aria-describedby reference to
    identify the description or error text that applies to that input.
