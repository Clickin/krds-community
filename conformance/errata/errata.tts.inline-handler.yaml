id: errata.tts.inline-handler
component: tts
upstream:
  version: 1.1.0
  files:
    - upstream/krds-html/html/code/tts.html
defect:
  type: serialized-inline-event-handler
  literalSource:
    selectors:
      - ".krds-tts[onclick]"
    behavior: >-
      The pinned HTML example serializes a JavaScript onclick source string. Framework-native
      event listeners preserve activation behavior but intentionally do not emit an onclick
      attribute, and several frameworks reject string event handlers.
correction:
  behavior: >-
    Bind activation through the framework's native event API without serializing executable
    JavaScript into markup. Preserve the native button, accessible name, focus behavior, and
    text-to-speech activation callback.
  attributes:
    - selector: ".krds-tts"
      attribute: onclick
      rule: "non-semantic-handler-source; framework listener required"
fixtures:
  - tts.default
normalization:
  whitelist:
    - selector: ".krds-tts"
      attribute: onclick
      rule: "omit serialized handler; preserve native activation"
evidence:
  sourceUrls:
    - https://html.spec.whatwg.org/multipage/webappapis.html#event-handler-attributes
  rationale: >-
    Event-handler content attributes are an implementation mechanism, not semantic DOM. Native
    framework listeners avoid executable markup while preserving the observable activation.
