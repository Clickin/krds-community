name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check dependency catalog policy
        run: pnpm catalog:check
      - name: Provision Chrome for browser tests
        uses: browser-actions/setup-chrome@v2.1.2
        with:
          install-dependencies: true
      - name: Check formatting
        run: pnpm format:check
      # Build the type-declaration surfaces first so package-to-package .d.ts
      # references (e.g. solid lint importing @krds-community/recipes) resolve on
      # a fresh checkout where dist/ is not committed. conformance-viewer is
      # excluded: its build reads reports/ (produced later by test:conformance).
      - name: Build workspaces (type declarations)
        run: pnpm -r --filter '!@krds-community/conformance-viewer' build && node scripts/copy-notices.mjs
      - name: Lint repository
        run: pnpm lint:oxide
      - name: Check React compiler rules
        run: pnpm lint:react-compiler
      - name: Lint every workspace
        run: pnpm lint:packages
      - name: Typecheck project references
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      - name: Run framework reactivity tests
        run: pnpm test:reactivity
      - name: Run SSR and hydration tests
        run: pnpm test:ssr
      - name: Run Chromium visual tests
        run: pnpm test:visual
      - name: Generate and gate full runtime conformance evidence
        run: pnpm test:conformance
      - name: Build conformance viewer (after reports exist)
        run: pnpm --filter @krds-community/conformance-viewer build
      - name: Check publishable package artifacts
        run: pnpm test:packages
      - name: Build documentation
        run: pnpm docs:build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Audit rendered Storybook inventories
        run: pnpm test:storybook:audit
      - name: Check release metadata
        run: pnpm changeset:status

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          package-manager-cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit
      # Trusted Publisher (OIDC): the ambient id-token is exchanged for a short-lived
      # npm token — no long-lived NPM_TOKEN required. `--provenance` mints sigstore
      # attestations from the same OIDC identity.
      - name: Publish to npm
        run: pnpm changeset publish --provenance
