<!--
  extra: krds-search-suggestions — 상태: active (open 상태에서 ArrowDown 1회 — 첫 제안 활성)
  fixture: search-suggestions.active 의 upstream(참조) 측 대상.
-->
<div class="krds-search-suggestions">
  <div class="form-group">
    <div class="form-tit">
      <label for="krds-search-suggestions-fixture">검색어</label>
    </div>
    <div class="form-conts">
      <input
        id="krds-search-suggestions-fixture"
        class="krds-input"
        type="text"
        name="search"
        placeholder="검색어를 입력하세요"
        role="combobox"
        aria-expanded="true"
        aria-controls="krds-search-suggestions-fixture-listbox"
        aria-autocomplete="list"
        aria-activedescendant="krds-search-suggestions-fixture-option-0"
        aria-describedby="krds-search-suggestions-fixture-status"
        value="건강"
      />
    </div>
  </div>
  <ul
    id="krds-search-suggestions-fixture-listbox"
    role="listbox"
    aria-label="추천 검색어"
    class="krds-suggestions-list"
  >
    <li
      id="krds-search-suggestions-fixture-option-0"
      role="option"
      aria-selected="true"
      class="krds-suggestions-item is-active"
    >
      건강보험 자격 확인
    </li>
    <li
      id="krds-search-suggestions-fixture-option-1"
      role="option"
      aria-selected="false"
      class="krds-suggestions-item"
    >
      건강검진 결과 조회
    </li>
    <li
      id="krds-search-suggestions-fixture-option-2"
      role="option"
      aria-selected="false"
      class="krds-suggestions-item"
    >
      건강보험료 조회
    </li>
  </ul>
  <p id="krds-search-suggestions-fixture-status" class="sr-only" aria-live="polite">
    3개의 추천 검색어가 표시되었습니다.
  </p>
</div>
